services:
  - type: web
    name: course-management-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@cms/api
    startCommand: npm run start --workspace=@cms/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
